<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Brain Boost</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      text-align: center;
    }

    header {
      padding: 80px 20px;
    }

    h1 {
      font-size: 60px;
      margin: 0;
    }

    p {
      font-size: 20px;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: white;
      color: #00aaff;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .section {
      background: white;
      color: black;
      padding: 60px 20px;
      margin-top: 40px;
      border-radius: 30px 30px 0 0;
    }

    .box {
      display: inline-block;
      width: 250px;
      margin: 15px;
      padding: 20px;
      border-radius: 15px;
      background: #f2f2f2;
    }

    input {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🧠 Brain Boost</h1>
    <p>Studia meglio, più veloce, senza stress</p>
    <a class="btn" href="#contenuti">Inizia ora</a>
  </header>

  <div class="section" id="contenuti">
    <h2>🔥 Contenuti virali</h2>

    <div class="box">
      <h3>📚 Riassunti veloci</h3>
      <p>Capitoli spiegati in modo semplice</p>
    </div>

    <div class="box">
      <h3>⚡ Metodi di studio</h3>
      <p>Impara a memorizzare più velocemente</p>
    </div>

    <div class="box">
      <h3>🎯 Focus mode</h3>
      <p>Come studiare senza distrazioni</p>
    </div>
  </div>

  <!-- AI SECTION -->
  <div class="section">
    <h2>🧠 Brain Boost AI</h2>

    <input type="file" id="fileInput">
    <br>
    <button class="btn" onclick="sendImage()">Analizza</button>

    <p id="result"></p>
  </div>

  <script>
    async function sendImage() {
      const file = document.getElementById("fileInput").files[0];

      if (!file) {
        alert("Seleziona un file!");
        return;
      }

      const formData = new FormData();
      formData.append("image", file);

      const res = await fetch("http://localhost:3000/api/analyze", {
        method: "POST",
        body: formData
      });

      const data = await res.json();
      document.getElementById("result").innerText = data.summary;
    }
  </script>

</body>
</html>
