<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Brain Boost</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white;
      text-align: center;
    }

    header {
      padding: 60px 20px;
    }

    h1 {
      font-size: 60px;
      margin: 0;
      letter-spacing: 2px;
    }

    p {
      font-size: 20px;
      opacity: 0.9;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: white;
      color: #00aaff;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #e6e6e6;
    }

    .section {
      background: white;
      color: black;
      padding: 50px 20px;
      margin-top: 40px;
      border-radius: 30px 30px 0 0;
    }

    .box {
      display: inline-block;
      width: 250px;
      margin: 15px;
      padding: 20px;
      border-radius: 15px;
      background: #f2f2f2;
    }
  </style>
</head>

<body>

  <header>
    <h1>🧠 Brain Boost</h1>
    <p>Studia meglio, più veloce, senza stress</p>
    <a class="btn" href="#contenuti">Inizia ora</a>
  </header>

  <div class="section" id="contenuti">
    <h2>🔥 Contenuti virali</h2>

    <div class="box">
      <h3>📚 Riassunti veloci</h3>
      <p>Capitoli spiegati in modo semplice</p>
    </div>

    <div class="box">
      <h3>⚡ Metodi di studio</h3>
      <p>Impara a memorizzare più velocemente</p>
    </div>

    <div class="box">
      <h3>🎯 Focus mode</h3>
      <p>Come studiare senza distrazioni</p>
    </div>

  </div>

</body>
</html>
